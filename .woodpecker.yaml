when:
  - event: pull_request
  - event: push
    branch: main

labels:
  ci_os: linux

steps:
  - name: validate
    image: ghcr.io/astral-sh/uv:0.13.7-python3.15-trixie@sha256:e251a906500a155fbd0940b1a01192f9ef941e6c493108a69fcc11bcafdf208d
    commands:
      - >-
        python -c "import pathlib, subprocess, sys, tomllib;
        tools = tomllib.loads(pathlib.Path('.mise.toml').read_text())['tools'];
        assert sys.version.split()[0] == tools['python'];
        assert subprocess.check_output(['uv', '--version']).decode().split()[1] == tools['uv']"
      - uv run --locked python scripts/validate_skills.py
  - name: test
    image: ghcr.io/astral-sh/uv:0.13.7-python3.15-trixie@sha256:e251a906500a155fbd0940b1a01192f9ef941e6c493108a69fcc11bcafdf208d
    commands:
      - uv run --locked python -m unittest discover -s tests -v
